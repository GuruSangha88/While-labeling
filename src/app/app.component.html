<!-- src/app/app.component.html -->
<div class="app-container" *ngIf="config$ | async as config">
  <header>
    <img [src]="config.logoPath" [alt]="config.appTitle" class="logo">
    <h1>{{ config.appTitle }}</h1>
  </header>

  <main>
    <div class="config-demo">
      <h2>Configuration Demo</h2>
      <div class="info-card">
        <p><strong>Current Date:</strong> {{ formatDate(currentDate, config.dateFormat) }}</p>
        <p><strong>Client ID:</strong> {{ config.clientId }}</p>
        <p><strong>Logo Path:</strong> {{ config.logoPath }}</p>
        <p><strong>Theme Colors:</strong></p>
        <div class="color-swatches">
          <div class="swatch" [style.background-color]="config.theme.primary"></div>
          <div class="swatch" [style.background-color]="config.theme.secondary"></div>
          <div class="swatch" [style.background-color]="config.theme.accent"></div>
        </div>
      </div>
    </div>
  </main>
</div>
